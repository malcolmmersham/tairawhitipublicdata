# Indicator registry (gold layer metadata).
# domain: HRHTO domain. direction: up | down | neutral (which way is "good").
# headline: shown on the "At a glance" tab. Attribution text is rendered under every chart.
# muka: left for Trust Tairāwhiti to map each indicator to the HRHTO muka/outcome.

sources:
  statsnz_ade:
    name: Stats NZ – Aotearoa Data Explorer
    url: https://explore.data.stats.govt.nz/
    attribution: "Source: Stats NZ, licensed under CC BY 4.0"
    cadence: annual
  msd_benefits:
    name: Ministry of Social Development – Benefit Fact Sheets
    url: https://www.msd.govt.nz/about-msd-and-our-work/publications-resources/statistics/benefit/index.html
    attribution: "Source: Ministry of Social Development, licensed under CC BY 4.0"
    cadence: quarterly
  hud_housing:
    name: Te Tūāpapa Kura Kāinga HUD – Government Housing Dashboard
    url: https://www.hud.govt.nz/stats-and-insights/the-government-housing-dashboard/
    attribution: "Source: Ministry of Housing and Urban Development, licensed under CC BY 4.0"
    cadence: monthly
  healthnz_immunisation:
    name: Health New Zealand | Te Whatu Ora – Immunisation coverage
    url: https://www.healthnz.govt.nz/about-us/health-data/data-sets-and-collections/immunisation-data-and-statistics/immunisation-coverage
    attribution: "Source: Health New Zealand | Te Whatu Ora, licensed under CC BY 4.0"
    cadence: quarterly
  nzta_cas:
    name: NZ Transport Agency Waka Kotahi – Crash Analysis System
    url: https://opendata-nzta.opendata.arcgis.com/datasets/NZTA::crash-analysis-system-cas-data-1/about
    attribution: "Source: NZ Transport Agency Waka Kotahi, licensed under CC BY 4.0"
    cadence: monthly
  mbie_bonds:
    name: MBIE Tenancy Services – Rental bond data
    url: https://www.tenancy.govt.nz/about-tenancy-services/data-and-statistics/rental-bond-data/
    attribution: "Source: MBIE Tenancy Services, licensed under CC BY 3.0 NZ"
    cadence: monthly
  statsnz_emissions:
    name: Stats NZ – Regional greenhouse gas emissions
    url: https://www.stats.govt.nz/tools/how-are-my-regions-emissions-tracking/
    attribution: "This work includes Stats NZ data licensed for reuse under CC BY 4.0"
    cadence: annual
  moe_attendance:
    name: Ministry of Education – Education Counts regular attendance
    url: https://www.educationcounts.govt.nz/statistics/attendance
    attribution: "Source: Ministry of Education, Education Counts, licensed under CC BY 4.0"
    cadence: termly

  mcert_local_elections:
    name: Department of Internal Affairs – Local authority election statistics
    url: https://www.mcert.govt.nz/our-work/local-government/local-elections-and-voting/local-authority-election-statistics/
    attribution: "Source: Department of Internal Affairs, licensed under CC BY 4.0"
    cadence: triennial
  statsnz_census_language:
    name: Stats NZ – Census languages spoken
    url: https://tools.summaries.stats.govt.nz/places/rc/gisborne-region
    attribution: "This work includes Stats NZ data licensed for reuse under CC BY 4.0"
    cadence: five-yearly

  statsnz_regional_gdp:
    name: Stats NZ – Regional gross domestic product
    url: https://www.stats.govt.nz/large-datasets/csv-files-for-download/
    attribution: "This work includes Stats NZ data licensed for reuse under CC BY 4.0"
    cadence: annual
    check_every_days: 7
  hud_affordability:
    name: HUD – Local housing statistics and affordability indicators
    url: https://www.hud.govt.nz/stats-and-insights/change-in-housing-affordability-indicators/about-the-indicators
    attribution: "Source: Ministry of Housing and Urban Development, licensed under CC BY 4.0"
    cadence: quarterly
    check_every_days: 7
  moe_leavers:
    name: Ministry of Education – School leaver attainment
    url: https://www.educationcounts.govt.nz/statistics/school-leavers
    attribution: "Source: Ministry of Education, Education Counts, licensed under CC BY 4.0"
    cadence: annual
    check_every_days: 7

indicators:
  gisborne_nominal_gdp:
    name: Regional GDP at current prices
    domain: Ōhanga
    topic: Regional economy
    direction: neutral
    headline: false
    format: currency
    caveat: "Production measure, in millions of New Zealand dollars, for the year ended March. Changes include price changes."
  gisborne_nominal_gdp_per_person:
    name: Regional GDP per person at current prices
    domain: Ōhanga
    topic: Regional economy
    direction: neutral
    headline: false
    format: currency
    caveat: "New Zealand dollars per person for the year ended March. Regional production per person differs from household income."
  hud_house_price_to_income:
    name: Median house price to median household income
    domain: Hapori
    topic: Housing affordability
    direction: down
    headline: false
    format: dec1
    caveat: "The published Local Housing Statistics time series for Gisborne District."
  hud_deposit_affordability:
    name: Deposit affordability index
    domain: Hapori
    topic: Housing affordability
    direction: neutral
    headline: false
    format: dec3
    caveat: "The HUD index compares house sale prices with median disposable household income over time."
  hud_mortgage_affordability:
    name: Mortgage affordability index
    domain: Hapori
    topic: Housing affordability
    direction: neutral
    headline: false
    format: dec3
    caveat: "The HUD index compares mortgage servicing costs with median disposable household income over time."
  hud_rent_affordability:
    name: Rent affordability index
    domain: Hapori
    topic: Housing affordability
    direction: neutral
    headline: false
    format: dec3
    caveat: "The HUD index compares rent prices on new bonds with median disposable household income over time."
  school_leavers_level_2:
    name: School leavers with NCEA Level 2 or above
    domain: Mātauranga
    topic: School leaver attainment
    direction: up
    headline: false
    format: pct
    caveat: "Percentage of school leavers with NCEA Level 2 or equivalent or above. Geography refers to the school’s location."

  gisborne_mayoral_turnout:
    name: Gisborne mayoral turnout
    domain: Tūhono
    topic: Civic participation
    display: snapshot
    direction: neutral
    headline: false
    format: pct
    caveat: "Share of enrolled electors voting in the contested Gisborne District Council mayoral election. The table shows verified election snapshots."
  gisborne_te_reo_speakers:
    name: People who can speak te reo Māori
    domain: Tūtangata
    topic: Te reo Māori
    display: snapshot
    direction: neutral
    headline: false
    format: pct
    caveat: "The 2023 Census figure is for Gisborne Region. The question asks whether people can have a conversation about everyday things in te reo Māori."

  regional_ghg_emissions:
    name: Gross greenhouse gas emissions
    domain: Taiao
    topic: Climate
    direction: down
    headline: false
    format: dec1
    caveat: "Gisborne Region industry and household emissions, in kilotonnes of CO₂ equivalent. Uses the production approach and the residence principle. Excludes consumption-based emissions. Earlier years can be revised."
  regular_school_attendance:
    name: Students attending school regularly
    domain: Mātauranga
    topic: School attendance
    direction: up
    headline: false
    format: pct
    caveat: "Percentage of students in Gisborne Region state and state-integrated schools who attended more than 90% of the term. COVID-19 affected comparability in 2020 and 2021. Reporting changed from Term 1 2025. CSV dates are the corresponding calendar-quarter boundaries for indexing by term."

  # ---- Hapori: population ----
  pop_estimate:
    name: Estimated resident population
    domain: Hapori
    topic: Population
    direction: neutral
    headline: true
    format: int
    caveat: "Estimated at 30 June. Rebased after each census (2023 rebase)."
  pop_median_age:
    name: Median age
    domain: Hapori
    topic: Population
    direction: neutral
    headline: false
    format: dec1
    caveat: "Half the population is older and half younger. Estimated at 30 June."

  # ---- Ōhanga ----
  bds_geographic_units:
    name: Business locations (geographic units)
    domain: Ōhanga
    topic: Business
    direction: up
    headline: true
    format: int
    caveat: "Business locations (geographic units) with economic activity, at February each year. Counts randomly rounded."
  bds_employee_count:
    name: Employees in business locations
    domain: Ōhanga
    topic: Business
    direction: up
    headline: false
    format: int
    caveat: "Employee count at February. Counts randomly rounded."
  msd_main_benefits_total:
    name: Working-age people on a main benefit
    domain: Ōhanga
    topic: Income support
    direction: down
    headline: true
    format: int
    caveat: "Working-age (18–64) recipients at the end of each quarter. Counts randomly rounded to base 3."
  msd_jobseeker:
    name: Jobseeker Support recipients
    domain: Ōhanga
    topic: Income support
    direction: down
    headline: true
    format: int
    caveat: "Best Tairāwhiti-only labour-market signal: the HLFS unemployment rate is only published for Gisborne/Hawke's Bay combined."
  msd_sole_parent:
    name: Sole Parent Support recipients
    domain: Ōhanga
    topic: Income support
    direction: down
    headline: false
    format: int
  msd_supported_living:
    name: Supported Living Payment recipients
    domain: Ōhanga
    topic: Income support
    direction: neutral
    headline: false
    format: int
    caveat: "Includes carers and people with a health condition or disability; a rise is not necessarily negative."

  # ---- Hapori: housing ----
  rent_geomean:
    name: Mean weekly rent, new bonds (geometric mean)
    domain: Hapori
    topic: Housing
    direction: down
    headline: true
    format: currency
    caveat: "Private-landlord bonds lodged in the month. Fixed random rounding; months with fewer than 5 bonds suppressed."
  rent_median:
    name: Median weekly rent, new bonds
    domain: Hapori
    topic: Housing
    direction: down
    headline: false
    format: currency
  bonds_active:
    name: Active rental bonds
    domain: Hapori
    topic: Housing
    direction: neutral
    headline: false
    format: int
  bonds_lodged:
    name: New rental bonds lodged
    domain: Hapori
    topic: Housing
    direction: neutral
    headline: false
    format: int
  hud_register_applicants:
    name: Social housing register applicants
    domain: Hapori
    topic: Housing
    direction: down
    headline: true
    format: int
    caveat: "Housing Register plus Transfer Register, at month end."
  hud_housing_register:
    name: Housing Register (new applicants waiting)
    domain: Hapori
    topic: Housing
    direction: down
    headline: false
    format: int
  hud_transfer_register:
    name: Transfer Register (tenants seeking a move)
    domain: Hapori
    topic: Housing
    direction: neutral
    headline: false
    format: int
  hud_social_housing_stock:
    name: Social housing places
    domain: Hapori
    topic: Housing
    direction: up
    headline: true
    format: int
  hud_social_housing_kainga_ora:
    name: Social housing places – Kāinga Ora
    domain: Hapori
    topic: Housing
    direction: up
    headline: false
    format: int
  hud_social_housing_chp:
    name: Social housing places – community housing providers
    domain: Hapori
    topic: Housing
    direction: up
    headline: false
    format: int
  hud_transitional_places:
    name: Transitional housing places (contracted)
    domain: Hapori
    topic: Housing
    direction: neutral
    headline: false
    format: int
  hud_eh_grants:
    name: Emergency housing grants approved
    domain: Hapori
    topic: Housing
    direction: down
    headline: false
    format: int
    caveat: "Emergency Housing Special Needs Grants. Monthly counts are small and volatile."
  hud_eh_clients:
    name: Households receiving emergency housing grants
    domain: Hapori
    topic: Housing
    direction: down
    headline: false
    format: int
  hud_eh_amount:
    name: Emergency housing grants – amount granted
    domain: Hapori
    topic: Housing
    direction: down
    headline: false
    format: currency

  # ---- Hapori: health ----
  imms_6m:
    name: Children fully immunised at 6 months
    domain: Hapori
    topic: Health
    direction: up
    headline: true
    format: pct
    caveat: "Rolling 12-month coverage by district of residence. National target is 95%."
  imms_12m:
    name: Children fully immunised at 12 months
    domain: Hapori
    topic: Health
    direction: up
    headline: false
    format: pct
  imms_24m:
    name: Children fully immunised at 24 months
    domain: Hapori
    topic: Health
    direction: up
    headline: true
    format: pct
    caveat: "Rolling 12-month coverage by district of residence. Health target: 95% by 24 months."
  imms_5y:
    name: Children fully immunised at 5 years
    domain: Hapori
    topic: Health
    direction: up
    headline: false
    format: pct

  # ---- Hapori: safety ----
  cas_dsi:
    name: Road deaths and serious injuries
    domain: Hapori
    topic: Safety
    direction: down
    headline: true
    format: int
    caveat: "Calendar year. CAS is live: recent years may still change. Current year is year-to-date."
  cas_deaths:
    name: Road deaths
    domain: Hapori
    topic: Safety
    direction: down
    headline: false
    format: int
    caveat: "Small annual numbers; read multi-year trends, not single years."
  cas_fatal_serious_crashes:
    name: Fatal and serious-injury crashes
    domain: Hapori
    topic: Safety
    direction: down
    headline: false
    format: int
  cas_injury_crashes:
    name: Injury crashes (all severities)
    domain: Hapori
    topic: Safety
    direction: down
    headline: false
    format: int
