- {id: M4, name: NZQA secondary statistics, publisher: NZQA, domain: Mātauranga, frequency: Annual, phase: 2, status: live, release: 3, note: "NCEA Level 1 (participation-based), Levels 2 and 3 and University Entrance (enrolment-based) for schools in NZQA's Gisborne region, 2016 onward. Separate from school leaver attainment. NZQA does not publish regional results by ethnicity.", url: https://www2.nzqa.govt.nz/ncea/understanding-secondary-quals/secondary-school-stats/}
- {id: M5, name: ECE participation, publisher: Ministry of Education, domain: Mātauranga, frequency: Quarterly, phase: 2, status: manual, release: 3, published: true, note: "Prior early learning participation for Gisborne District school starters from 2018. Reviewed workbook fallback.", url: https://www.educationcounts.govt.nz/statistics/participation}
