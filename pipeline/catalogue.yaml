- {id: T2, name: LAWA recreational water quality, publisher: GDC via LAWA, domain: Taiao, frequency: Annual, phase: 2, status: manual, release: 2, published: true, note: "Routine river E. coli and coastal enterococci samples by monitoring site and date from LAWA's reviewed release. Check the Council for current swimming advice.", url: https://www.gdc.govt.nz/recreation/can-i-swim-here}
- {id: T3, name: LAWA groundwater and lakes, publisher: GDC via LAWA, domain: Taiao, frequency: Annual, phase: 2, status: planned, release: 3, note: "LAWA blocks automated downloads. A reviewed manual file is needed, as for recreational water.", url: https://www.lawa.org.nz/download-data}
- {id: T4, name: GDC Hilltop hydrology, publisher: Gisborne District Council, domain: Taiao, frequency: Near-real-time, phase: 3, status: planned, release: 3, note: "GDC has not published a public Hilltop endpoint. Confirm the server address and reuse terms with GDC before building annual rainfall and river flow aggregates."}
- {id: T5, name: National Climate Database (DataHub), publisher: Earth Sciences NZ, domain: Taiao, frequency: Monthly, phase: 3, status: planned, release: 3, note: "DataHub station downloads and its API need a free DataHub account and API key. The Ministry for the Environment data service also needs an API key for its 30-site rainfall and temperature tables.", url: https://data.niwa.co.nz/collections/daily-climate-station}
