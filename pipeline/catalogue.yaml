- {id: M7, name: Tertiary participation, publisher: Ministry of Education, domain: Mātauranga, frequency: Annual, phase: 2, status: planned, release: 3, note: "Education Counts is the only verified publisher of tertiary participation by region of residence and refuses automated downloads. A reviewed publisher workbook in data/manual is needed. School-leaver progression is a separate measure.", url: https://www.educationcounts.govt.nz/statistics/tertiary-participation}
- {id: M8, name: School rolls / Māori-medium enrolment, publisher: Ministry of Education, domain: Mātauranga, frequency: Annual, phase: 2, status: manual, release: 2, published: true, note: "July school rolls from 1996 and Māori-medium enrolment from 2000, both by school location in Gisborne District. Māori-medium counts combine immersion levels 1 and 2.", url: https://www.educationcounts.govt.nz/statistics/maori-language-in-schooling}
