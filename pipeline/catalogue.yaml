- {id: H9, name: Change in Housing Affordability Indicators, publisher: HUD, domain: Hapori, frequency: Quarterly, phase: 2, status: live, release: 2, note: "Gisborne District deposit, mortgage and rent affordability indices.", url: https://www.hud.govt.nz/stats-and-insights/change-in-housing-affordability-indicators/about-the-indicators}
- {id: H10, name: NPS-UD Dashboard, publisher: HUD, domain: Hapori, frequency: Quarterly, phase: 2, status: reference, release: 3, note: "HUD publishes the urban development dashboard as an interactive app without a downloadable Gisborne series. Other connectors cover several market indicators. H28 records the separate official Urban Land Dashboard price-to-cost release.", url: https://www.hud.govt.nz/stats-and-insights/urban-development-dashboard}
- {id: H11, name: Rental bond data, publisher: MBIE, domain: Hapori, frequency: Monthly, phase: 1, status: live, note: "Monthly territorial authority CSV from Tenancy Services."}
- {id: H12, name: House sales/prices (REINZ, CoreLogic), publisher: REINZ / CoreLogic, domain: Hapori, frequency: Monthly, phase: 3, status: deferred, note: "Commercial data. Reopen if public redistribution rights are granted."}
- {id: H13, name: Childhood immunisation coverage, publisher: Health NZ, domain: Hapori, frequency: Quarterly, phase: 1, status: live, note: "Rolling 12-month files from Oct 2022. Separate quarterly-cohort series from April–June 2009, parsed from the older .xls/.xlsx quarterly files."}
- {id: H14, name: HPV and influenza vaccination, publisher: Health NZ, domain: Hapori, frequency: Quarterly/weekly, phase: 2, status: live, release: 3, note: "HPV coverage by age 14 for Tairāwhiti district from July–September 2024. The flu vaccine page shows only the current season as HTML with no archive, so influenza is not yet a series.", url: https://www.healthnz.govt.nz/about-us/health-data/data-sets-and-collections/immunisation-data-and-statistics/hpv-immunisation-coverage-data}
- {id: H15, name: Health targets (ED <6h etc.), publisher: Health NZ, domain: Hapori, frequency: Quarterly, phase: 3, status: manual, note: "Review Health NZ targets tables on each release and use only published local cells."}
