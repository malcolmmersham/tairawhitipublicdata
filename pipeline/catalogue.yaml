- {id: H28, name: Urban Land Dashboard price-to-cost ratio, publisher: HUD, domain: Hapori, frequency: Annual, phase: 3, status: live, note: "Annual new-build sale prices relative to estimated construction costs for total residential dwellings in Gisborne District.", url: https://www.hud.govt.nz/stats-and-insights/urban-land-dashboard/data-download}
- {id: M1, name: School attendance, publisher: Ministry of Education, domain: Mātauranga, frequency: Termly, phase: 1, status: manual, release: 1, published: true, note: "Gisborne Region regular attendance from 2019. GitHub uses reviewed publisher workbooks when Education Counts blocks downloads.", url: https://www.educationcounts.govt.nz/statistics/attendance}
- {id: M2, name: Daily attendance dashboard, publisher: Ministry of Education, domain: Mātauranga, frequency: Weekly, phase: 2, status: deferred, note: "Termly attendance covers recurring reporting. Reopen if a reusable and comparable daily local series is available."}
