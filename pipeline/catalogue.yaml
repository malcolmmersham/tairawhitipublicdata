# Dataset library (from the Tairāwhiti Longitudinal Open Data Library and Connector Plan, Nov 2026).
# status: live | manual | planned | reference | deferred
# phase: roadmap phase from the plan. Update status as connectors are added.
- {id: E1, name: Regional GDP, publisher: Stats NZ, domain: Ōhanga, frequency: Annual, phase: 2, status: live, release: 2, note: "Stats NZ regional release CSV. Nominal GDP and GDP per person from 2000, with the New Zealand GDP per person from the same release as a national benchmark. The CSV also has Gisborne GDP for 23 industry groups to year ended March 2024. Publishing these is a separate decision about which industries to chart.", url: https://www.stats.govt.nz/large-datasets/csv-files-for-download/}
- {id: E2, name: Modelled TA GDP (MTAGDP), publisher: MBIE, domain: Ōhanga, frequency: Irregular, phase: 2, status: manual, note: "MBIE's 2026 release has a full-data CSV with GDP by territorial authority and industry for years ended March 2000–2024 and total GDP for 2025. MBIE calls it experimental and indicative only. Stats NZ regional GDP (E1) stays the official measure. mbie.govt.nz serves bot protection to automated requests, so the file could not be retrieved or reviewed on 22 Nov 2026. Reopen when a steward saves the CSV with its publisher filename and confirms the licence and Gisborne District rows. Then build a reviewed-release connector and keep the model vintage.", url: https://www.mbie.govt.nz/business-and-employment/economic-growth/regional-economic-development/modelled-territorial-authority-gross-domestic-product/2026-release}
- {id: E3, name: Business Demography Statistics, publisher: Stats NZ, domain: Ōhanga, frequency: Annual, phase: 1, status: live, note: "ADE BDS_BDS_001"}
- {id: E4, name: Linked Employer-Employee Data (LEED), publisher: Stats NZ, domain: Ōhanga, frequency: Quarterly, phase: 2, status: live, release: 3, note: "ADE LEED_Q1W_005. Quarterly filled jobs, median full-quarter earnings and worker turnover for Gisborne Region, June 1999 quarter onward. Median earnings and turnover carry the table's New Zealand total (R3Z) as a national benchmark. Latest quarter on 22 Nov 2026 was June 2025.", url: https://www.stats.govt.nz/information-releases/linked-employer-employee-data-june-2025-quarter/}
- {id: E5, name: Monthly Employment Indicators, publisher: Stats NZ, domain: Ōhanga, frequency: Monthly, phase: 2, status: live, release: 2, note: "Monthly filled jobs for Gisborne Region.", url: https://www.stats.govt.nz/topics/employment-and-unemployment/}
- {id: E6, name: HLFS – regional, publisher: Stats NZ, domain: Ōhanga, frequency: Quarterly, phase: 2, status: deferred, note: "Combined Gisborne and Hawke’s Bay. Reopen for a credible Tairāwhiti measure."}
- {id: E7, name: Electronic Card Transactions – regional, publisher: Stats NZ, domain: Ōhanga, frequency: Monthly, phase: 2, status: deferred, release: 3, note: "No Gisborne series found. The October 2026 release CSV and workbook give national values by industry only, and ADE has no card transactions dataflow. A national-only total retail spend line does not match the visitor-only TECT scope (E9), so it is not used as a benchmark. Reopen if Stats NZ publishes regional values."}
- {id: E8, name: Monthly Regional Tourism Estimates, publisher: MBIE, domain: Ōhanga, frequency: Monthly, phase: 2, status: reference, note: "Historical reference. MBIE paused the series in October 2026. Keep any replacement spend measure separate.", url: https://teic.mbie.govt.nz/teiccategories/datareleases/mrte/}
- {id: E9, name: Tourism Electronic Card Transactions, publisher: MBIE, domain: Ōhanga, frequency: Monthly, phase: 4, status: live, release: 3, note: "Monthly electronic card spend in Gisborne Region by domestic visitors (cardholders from other regions) and international visitors, January 2018 to December 2025, in NZD million. TECTs exclude local residents, cash and other non-card spend, so they are not total tourism expenditure. MBIE paused the MRTEs (E8) and plans to resume TECTs in early 2027. The connector picks up new months automatically.", url: https://teic.mbie.govt.nz/teiccategories/datareleases/tects/}
- {id: E10, name: Accommodation Data Programme, publisher: MBIE, domain: Ōhanga, frequency: Monthly, phase: 2, status: live, release: 2, note: "Regional council estimates for commercial guest nights and active establishments, June 2020 onward.", url: https://teic.mbie.govt.nz/teiccategories/datareleases/adp/}
- {id: E11, name: Regional Economic Activity Web Tool, publisher: MBIE, domain: Ōhanga, frequency: Periodic, phase: 2, status: reference, note: "Publisher aggregator for source discovery and comparison.", url: https://www.mbie.govt.nz/business-and-employment/economic-growth/regional-economic-development/regional-economic-activity-tool}
- {id: E12, name: Agricultural Production Statistics, publisher: Stats NZ, domain: Ōhanga, frequency: Annual, phase: 2, status: live, release: 3, note: "ADE AGR_AGR_001–003. Gisborne Region sheep and beef cattle (1994–2025), kiwifruit, apple, wine grape and squash area (1994–2024), and exotic timber harvested (year ended March 2005–2018).", url: https://www.stats.govt.nz/topics/agriculture/}
- {id: E13, name: Building consents issued, publisher: Stats NZ, domain: Ōhanga, frequency: Monthly, phase: 2, status: live, release: 2, note: "Monthly Gisborne District dwelling counts and construction consent values from Stats NZ release files.", url: https://www.stats.govt.nz/topics/building/}
- {id: E14, name: Residential electricity consumption, publisher: Electricity Authority EMI, domain: Ōhanga, frequency: Annual, phase: 2, status: live, release: 2, note: "Annual average residential electricity off-take in Gisborne Region, 2016 onward.", url: https://www.emi.ea.govt.nz/Retail/Reports/ZSZG4D}
- {id: E15, name: Infometrics regional profile, publisher: Infometrics, domain: Ōhanga, frequency: Quarterly, phase: 3, status: deferred, note: "Proprietary. Reopen if the publisher grants public redistribution rights."}
- {id: H1, name: Subnational population estimates, publisher: Stats NZ, domain: Hapori, frequency: Annual, phase: 1, status: live, note: "ADE POPES_SUB_011"}
- {id: H2, name: Subnational population projections, publisher: Stats NZ, domain: Hapori, frequency: ~3-yearly, phase: 2, status: manual, published: true, note: "Published 2023-base low, medium and high Gisborne Region projection scenarios.", url: https://www.stats.govt.nz/information-releases/subnational-population-projections-2023base-2053/}
- {id: H3, name: Births and deaths, publisher: Stats NZ, domain: Hapori, frequency: Annual, phase: 2, status: live, release: 2, note: "Annual registered births and deaths for Gisborne Region from 2012.", url: https://www.stats.govt.nz/topics/births-and-deaths/}
- {id: H4, name: Census 2013/2018/2023, publisher: Stats NZ, domain: Hapori, frequency: Five-yearly, phase: 1, status: live, release: 2, note: "Reviewed scope is families and households in occupied private dwellings, 2013–2023.", url: https://tools.summaries.stats.govt.nz/places/rc/gisborne-region}
- {id: H5, name: Benefit Fact Sheets – regional council, publisher: MSD, domain: Hapori, frequency: Quarterly, phase: 1, status: live, note: "Rebuilt from archives back to Sept 2013"}
- {id: H6, name: Supplementary and hardship assistance, publisher: MSD, domain: Hapori, frequency: Quarterly, phase: 2, status: deferred, note: "East Coast service region is wider than Tairāwhiti. Reopen if a local series is released."}
