- {id: H17, name: NZ Health Survey – regional, publisher: Ministry of Health, domain: Hapori, frequency: Annual, phase: 2, status: live, release: 3, note: "Pooled 2011–14, 2014–17 and 2017–20 Tairāwhiti estimates from the 2017–20 Regional Data Explorer CSV. The 2011/12–2023/24 regional release on health.govt.nz refuses automated requests and needs a reviewed manual file.", url: https://minhealthnz.shinyapps.io/nz-health-survey-2017-20-regional-update/}
- {id: H18, name: PHO enrolment, publisher: Health NZ, domain: Hapori, frequency: Quarterly, phase: 1, status: live, release: 2, note: "Quarterly district workbooks from April 2019: people enrolled and the share of Health NZ's projected district population.", url: https://www.healthnz.govt.nz/about-us/health-data/data-sets-and-collections/primary-care-data-and-statistics/enrolment-with-a-general-practice-and-primary-health-organisation}
- {id: H19, name: Mortality web tool, publisher: Health NZ, domain: Hapori, frequency: Annual, phase: 3, status: manual, note: "Use a reviewed aggregate mortality export with a verified local geography. The web tool's downloads are generated per session in the Shiny app, so they cannot be fetched repeatably."}
- {id: H20, name: Cancer web tool, publisher: Health NZ, domain: Hapori, frequency: Annual, phase: 3, status: manual, note: "Use an approved aggregate cancer export with publisher suppression preserved. The web tool's downloads are generated per session in the Shiny app, so they cannot be fetched repeatably."}
- {id: H21, name: Suicide web tool, publisher: Health NZ, domain: Hapori, frequency: Annual, phase: 3, status: manual, note: "Use publisher multi-year local rates and preserve suppression and uncertainty. The web tool's downloads are generated per session in the Shiny app, so they cannot be fetched repeatably."}
