- {id: H26, name: Oranga Tamariki / Corrections, publisher: OT / Corrections, domain: Hapori, frequency: Quarterly, phase: 3, status: deferred, note: "Reopen once a consistent, redistributable Tairāwhiti aggregate is available."}
