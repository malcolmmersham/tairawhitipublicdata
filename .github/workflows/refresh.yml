name: Refresh data

# Daily at 06:17 NZST (18:17 UTC). Publishers release monthly/quarterly; a daily
# check picks up new files within a day and costs ~3 minutes of Actions time.
on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Space-separated source ids to run (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run connectors and rebuild dashboard
        env:
          STATSNZ_API_KEY: ${{ secrets.STATSNZ_API_KEY }}
          MBIE_BOND_CSV_URL: ${{ vars.MBIE_BOND_CSV_URL }}
        run: python -m pipeline.run ${{ github.event.inputs.sources }}
      - name: Commit changed data
        run: |
          git config user.name "tairawhiti-data-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/silver data/gold data/status.json site/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
      - name: Upload site
        if: vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: refresh
    if: vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
