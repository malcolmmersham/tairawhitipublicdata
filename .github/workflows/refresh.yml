name: Refresh data

# Daily at 18:17 UTC (06:17 NZST / 07:17 NZDT the following morning).
on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Space-separated source ids to run (blank = all)"
        required: false
        default: ""
      publish_existing:
        description: "Rebuild and publish from the committed data without fetching sources"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      source_failures: ${{ steps.source_status.outputs.failed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run connectors and rebuild dashboard
        env:
          STATSNZ_API_KEY: ${{ secrets.STATSNZ_API_KEY }}
          MBIE_BOND_CSV_URL: ${{ vars.MBIE_BOND_CSV_URL }}
          REQUESTED_SOURCES: ${{ inputs.sources }}
          PUBLISH_EXISTING: ${{ inputs.publish_existing }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$PUBLISH_EXISTING" == true ]]; then
            python -m pipeline.run --build-only
          elif [[ "$EVENT_NAME" == schedule ]]; then
            python -m pipeline.run --scheduled
          else
            read -r -a sources <<< "$REQUESTED_SOURCES"
            python -m pipeline.run -- "${sources[@]}"
          fi
      - name: Record connector failures
        id: source_status
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          status = json.loads(Path("data/status.json").read_text())
          failed = [name for name, source in status.items() if not source["ok"]]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"failed={str(bool(failed)).lower()}", file=output)
          if failed:
              print("Connectors retaining their last good data:", ", ".join(failed))
          PY
      - name: Commit changed data
        run: |
          git config user.name "tairawhiti-data-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/silver data/gold data/status.json site/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  report-source-failures:
    needs: [refresh, deploy]
    if: always() && needs.refresh.outputs.source_failures == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Flag failed connectors
        run: |
          echo '::error::One or more connectors failed. See the refresh job and Data status for details.'
          exit 1
